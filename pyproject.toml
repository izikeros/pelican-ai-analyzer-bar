[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pelican-ai-analyzer-bar"
version = "1.0.0"
description = "Pelican plugin that adds AI service buttons for article analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Krystian Safjan", email = "ksafjan@gmail.com"}
]
keywords = ["pelican", "plugin", "ai", "chatgpt", "perplexity", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pelican",
    "Framework :: Pelican :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = ["pelican>=4.5"]

[project.urls]
Homepage = "https://github.com/izikeros/pelican-ai-analyzer-bar"
Repository = "https://github.com/izikeros/pelican-ai-analyzer-bar"

[tool.setuptools.packages.find]
where = ["."]
include = ["pelican_ai_analyzer_bar*"]
